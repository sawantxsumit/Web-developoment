<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="a"></p>
    <script>
        let text=''
        let i=0
        while(i<=7)
        {
            text+='The number is '+i+ '<br>'
            i++;
        }
        document.getElementById('a').innerHTML=text
    </script>
</body>
</html>
